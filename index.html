<!DOCTYPE html>
<html lang="es">
<head>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=20261018u">
</head>
<body>
<div id="app">
  <!-- Fluxos de tela cheia -->
  <section id="s-login" class="scr full"></section>
  <section id="s-cadastro" class="scr full"></section>
  <section id="s-montando" class="scr full"></section>

  <!-- Abas -->
  <section id="s-inicio" class="scr"></section>
  <section id="s-up1" class="scr"></section>
  <section id="s-up2" class="scr"></section>
  <section id="s-chat" class="scr"></section>
  <section id="s-perfil" class="scr"></section>
  <section id="s-dia" class="scr"></section>
</div>

<!-- Menu de baixo: Inicio · Activación · [Día] · Ejecución · Chat (o agente de suporte; nome em CONFIG.AGENTE) -->
<nav class="nav hidden" id="nav">
  <button class="nav-i" data-tab="inicio" onclick="App.tab('inicio')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
    <span>Inicio</span>
  </button>
  <button class="nav-i u1" data-tab="up1" onclick="App.tab('up1')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
    <span id="nav-up1-lbl">Activación</span>
  </button>
  <button class="nav-c" id="nav-center" onclick="App.centro()"></button>
  <button class="nav-i u2" data-tab="up2" onclick="App.tab('up2')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>
    <span id="nav-up2-lbl">Ejecución</span>
  </button>
  <button class="nav-i" data-tab="chat" onclick="App.tab('chat')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.5-4.6A8 8 0 1 1 21 12z"/></svg>
    <span id="nav-chat-lbl">Clara</span>
  </button>
</nav>

<!-- Barra de sessão ativa (quem saiu no meio) -->
<div class="activa hidden" id="activa" onclick="App.retomar()"></div>

<!-- Player da sessão -->
<div class="player" id="player"></div>

<!-- Leitor de conteúdo (bônus, lições, guia do Up2) -->
<div class="reader" id="reader">
  <div class="reader-hd">
    <button class="xbtn" onclick="App.fecharLeitor()" aria-label="Volver">&#8249;</button>
    <div class="grow" id="reader-title"></div>
  </div>
  <div class="reader-body" id="reader-body"></div>
</div>

<!-- Folha genérica (modais) -->
<div class="ov" id="ov" onclick="if(event.target===this)App.fecharFolha()"><div class="sheet" id="sheet"></div></div>

<!-- Aviso no topo (Clara te dejó un mensaje) -->
<div class="toast" id="toast" onclick="App.toastClick()"></div>

<!-- Pílula da oferta com prazo -->
<button class="oferta-pill hidden" id="oferta-pill" onclick="App.abrirOferta()"></button>

<script src="datos/config.js?v=20261014c"></script>
<script src="datos/programa.js?v=20261013"></script>
<script src="datos/mensajes.js?v=20261014"></script>
<script src="datos/upsells.js?v=20261013"></script>
<script src="datos/bonos.js?v=20261013"></script>
<script src="datos/cifrado.js?v=20261018u"></script>
<script src="memoria-mezcla.js?v=20261014"></script>
<script src="app.js?v=20261018u"></script>
</body>
</html>
